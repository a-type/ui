name: Publish Storybook PR preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  publish-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: pr-preview-${{ github.event.pull_request.number }}
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v3
        with:
          run_install: true
          version: 11.3.0

      - name: Build Storybook for preview
        run: pnpm build && pnpm build-storybook
        env:
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/

      - uses: actions/checkout@v4
        with:
          path: gh-pages

      - name: Publish preview to gh-pages
        run: |
          set -euo pipefail
          cd gh-pages

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

          PREVIEW_PATH="pr-${{ github.event.pull_request.number }}"
          rm -rf "${PREVIEW_PATH}"
          mkdir -p "${PREVIEW_PATH}"
          cp -R ../storybook-static/. "${PREVIEW_PATH}/"
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .nojekyll "${PREVIEW_PATH}"

          if git diff --cached --quiet; then
            echo "No preview changes to commit"
            exit 0
          fi

          git commit -m "Update Storybook preview for PR #${{ github.event.pull_request.number }}"
          git push origin gh-pages

      - name: Post preview URL comment
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/`;
            const marker = '<!-- storybook-preview-comment -->';
            const body = `${marker}\n📖 **Storybook preview deployed!** [View it here](${previewUrl})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
            });

            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ github.event.pull_request.number }},
                body,
              });
            }
